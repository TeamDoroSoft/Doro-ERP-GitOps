apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - availability.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: queue-api
    app.kubernetes.io/part-of: doro-erp
configMapGenerator:
  - name: queue-api-runtime
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_REGION=ap-northeast-2
      - QUEUE_PORT=8084
      - QUEUE_ORDER_EVENTS_ENABLED=false
      - QUEUE_AUDIT_OUTBOX_ENABLED=false
      - QUEUE_INTERNAL_FULFILLMENT_ENABLED=false
