apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - availability.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: store-access-api
    app.kubernetes.io/part-of: doro-erp
configMapGenerator:
  - name: store-access-api-runtime
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_REGION=ap-northeast-2
      - STORE_ACCESS_PORT=8081
      - STORE_ACCESS_AUDIT_OUTBOX_ENABLED=false
      - STORE_ACCESS_EDGE_PUBLIC_HMAC_ENABLED=true
