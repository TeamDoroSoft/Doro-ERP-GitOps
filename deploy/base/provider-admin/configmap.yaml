apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-admin-nginx
  labels:
    app.kubernetes.io/name: provider-admin
    app.kubernetes.io/part-of: doro-erp-admin
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;
        index admin.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Provider Admin Edge requires the Spring "admin" profile and its own
        # private runtime/credentials. Until that boundary is deployed, keep API
        # calls fail-closed instead of proxying them to the public Edge runtime.
        location /api/ {
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Provider Admin API unavailable","status":503,"code":"PROVIDER_ADMIN_API_NOT_CONFIGURED"}';
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        location / {
            try_files $uri $uri/ /admin.html;
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
