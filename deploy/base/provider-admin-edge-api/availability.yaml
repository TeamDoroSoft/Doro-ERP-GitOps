apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: provider-admin-edge-api
  labels:
    app.kubernetes.io/name: provider-admin-edge-api
    app.kubernetes.io/part-of: doro-erp-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: provider-admin-edge-api
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: provider-admin-edge-api
  labels:
    app.kubernetes.io/name: provider-admin-edge-api
    app.kubernetes.io/part-of: doro-erp-admin
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-admin-edge-api
