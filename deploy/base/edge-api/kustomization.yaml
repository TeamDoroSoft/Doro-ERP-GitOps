apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - availability.yaml
  - httproute.yaml
  - target-group-configuration.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: edge-api
    app.kubernetes.io/part-of: doro-erp
configMapGenerator:
  - name: edge-api-runtime
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - EDGE_PORT=8080
