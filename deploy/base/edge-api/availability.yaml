apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-api
  labels:
    app.kubernetes.io/name: edge-api
    app.kubernetes.io/part-of: doro-erp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-api
  labels:
    app.kubernetes.io/name: edge-api
    app.kubernetes.io/part-of: doro-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-api
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
