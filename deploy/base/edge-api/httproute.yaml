apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edge-api-route
  labels:
    app.kubernetes.io/name: edge-api
    app.kubernetes.io/part-of: doro-erp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: doro-cell-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - group: ""
          kind: Service
          name: edge-api
          port: 8080
          weight: 1
