apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-runtime-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: commerce-api
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.24.0.0/16
      ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.24.0.0/16
              - 172.20.0.0/16
      ports:
        - port: 443
          protocol: TCP
