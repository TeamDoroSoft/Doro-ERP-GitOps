apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-application
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - edge
          - application
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-dns
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - edge
          - application
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-pod-identity-agent
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - edge
          - application
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-from-vpc-load-balancer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.24.0.0/16
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-module-apis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: store-access-api
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: commerce-api
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-api
      ports:
        - port: 8083
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit-api
      ports:
        - port: 8085
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-module-api-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - store-access-api
          - commerce-api
          - payment-api
          - queue-api
          - audit-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge-api
      ports:
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8085
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: store-access-api
      ports:
        - port: 8082
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: commerce-api
      ports:
        - port: 8081
          protocol: TCP
        - port: 8084
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-api
      ports:
        - port: 8082
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-store-access-runtime-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: store-access-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: commerce-api
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.24.0.0/16
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 443
          protocol: TCP
---
