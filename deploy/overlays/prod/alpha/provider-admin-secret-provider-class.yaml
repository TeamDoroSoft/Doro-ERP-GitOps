apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: provider-admin-edge-api
  labels:
    app.kubernetes.io/name: provider-admin-edge-api
    app.kubernetes.io/part-of: doro-erp-admin
spec:
  provider: aws
  secretObjects:
    - secretName: doro-erp-provider-admin-edge-runtime
      type: Opaque
      data:
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_ISSUER, key: DORO_PROVIDER_ADMIN_OIDC_ISSUER }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_AUTHORIZATION_URI, key: DORO_PROVIDER_ADMIN_OIDC_AUTHORIZATION_URI }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_TOKEN_URI, key: DORO_PROVIDER_ADMIN_OIDC_TOKEN_URI }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_JWK_SET_URI, key: DORO_PROVIDER_ADMIN_OIDC_JWK_SET_URI }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_CLIENT_ID, key: DORO_PROVIDER_ADMIN_OIDC_CLIENT_ID }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_CLIENT_SECRET, key: DORO_PROVIDER_ADMIN_OIDC_CLIENT_SECRET }
        - { objectName: DORO_PROVIDER_ADMIN_OIDC_REDIRECT_URI, key: DORO_PROVIDER_ADMIN_OIDC_REDIRECT_URI }
        - { objectName: DORO_PROVIDER_ADMIN_ALLOWED_GROUP, key: DORO_PROVIDER_ADMIN_ALLOWED_GROUP }
        - { objectName: DORO_PROVIDER_ADMIN_SESSION_COOKIE_SECRET, key: DORO_PROVIDER_ADMIN_SESSION_COOKIE_SECRET }
        - { objectName: DORO_PROVIDER_ADMIN_EXPECTED_ORIGIN, key: DORO_PROVIDER_ADMIN_EXPECTED_ORIGIN }
        - { objectName: DORO_HMAC_EDGE_TO_STORE_ACCESS_ADMIN_SECRET, key: DORO_HMAC_EDGE_TO_STORE_ACCESS_ADMIN_SECRET }
  parameters:
    region: ap-northeast-2
    usePodIdentity: "true"
    objects: |
      - objectName: "doro-erp/prod/alpha/provider-admin-edge"
        objectType: "secretsmanager"
        jmesPath:
          - { path: "DORO_PROVIDER_ADMIN_OIDC_ISSUER", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_ISSUER" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_AUTHORIZATION_URI", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_AUTHORIZATION_URI" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_TOKEN_URI", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_TOKEN_URI" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_JWK_SET_URI", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_JWK_SET_URI" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_CLIENT_ID", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_CLIENT_ID" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_CLIENT_SECRET", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_CLIENT_SECRET" }
          - { path: "DORO_PROVIDER_ADMIN_OIDC_REDIRECT_URI", objectAlias: "DORO_PROVIDER_ADMIN_OIDC_REDIRECT_URI" }
          - { path: "DORO_PROVIDER_ADMIN_ALLOWED_GROUP", objectAlias: "DORO_PROVIDER_ADMIN_ALLOWED_GROUP" }
          - { path: "DORO_PROVIDER_ADMIN_SESSION_COOKIE_SECRET", objectAlias: "DORO_PROVIDER_ADMIN_SESSION_COOKIE_SECRET" }
          - { path: "DORO_PROVIDER_ADMIN_EXPECTED_ORIGIN", objectAlias: "DORO_PROVIDER_ADMIN_EXPECTED_ORIGIN" }
      - objectName: "doro-erp/prod/alpha/hmac/edge-to-store-access-admin"
        objectType: "secretsmanager"
        jmesPath:
          - { path: "DORO_HMAC_EDGE_TO_STORE_ACCESS_ADMIN_SECRET", objectAlias: "DORO_HMAC_EDGE_TO_STORE_ACCESS_ADMIN_SECRET" }
