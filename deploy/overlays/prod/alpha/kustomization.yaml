    newName: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/doro-erp-edge
    digest: sha256:9803bad1cfc4737c7305f852e18d26a084e19fbb9117de2c53bc6d2d14a68a52 # source-revision: 14c285d58168784a5b182303afff95a417ca2767
  - name: doro-erp-store-access
