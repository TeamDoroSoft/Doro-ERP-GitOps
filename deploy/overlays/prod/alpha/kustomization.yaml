apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - ../../../base/provider-admin
  - ../../../base/provider-admin-edge-api
  - provider-admin-namespace.yaml
  - network-policies.yaml
  - provider-admin-network-policies.yaml
  - gateway.yaml
  - provider-admin-gateway.yaml
  - provider-admin-secret-provider-class.yaml
components:
  - ../../../components/secrets-manager
patches:
  - target:
      kind: NetworkPolicy
    patch: |-
      # NetworkPolicy resources do not carry the application ownership label.
      # Start from the public namespace; the Admin ownership patch below then
      # moves only Admin policies into their isolated namespace.
      - op: add
        path: /metadata/namespace
        value: doro-alpha
  - target:
      labelSelector: app.kubernetes.io/part-of=doro-erp
    patch: |-
      - op: add
        path: /metadata/namespace
        value: doro-alpha
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=doro-erp
    patch: |-
      # Prod Alpha intentionally runs worker nodes in one AZ. Keep the hard
      # hostname spread from Base, but remove its two-zone scheduling gate.
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints/0
  - target:
      kind: Deployment
      name: commerce-api
    patch: |-
      # Runtime ConfigMaps use stable names, so change the Pod template when
      # enabling consumers to ensure Argo CD rolls Commerce automatically.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          doro.minseok.click/runtime-config-revision: commerce-events-payment-handoff-v1
          doro.minseok.click/runtime-secret-revision: complete-internal-hmac-directions-v1
  - target:
      kind: Deployment
      name: edge-api
    patch: |-
      # Stable ConfigMap and Secret names require explicit Pod-template revisions.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          doro.minseok.click/runtime-config-revision: edge-public-checkout-forward-headers-v2
          doro.minseok.click/runtime-secret-revision: public-checkout-rate-limit-v1
  - target:
      kind: Deployment
      name: queue-api
    patch: |-
      # Runtime ConfigMaps use stable names, so change the Pod template when
      # enabling consumers to ensure Argo CD rolls Queue automatically.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          doro.minseok.click/runtime-config-revision: queue-store-access-context-v1
          doro.minseok.click/runtime-secret-revision: queue-to-store-access-v1
  - target:
      kind: Deployment
      name: store-access-api
    patch: |-
      # Stable Secret names require a Pod-template revision so the JVM reloads
      # every newly mapped internal HMAC environment variable.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          doro.minseok.click/runtime-config-revision: store-access-payment-handoff-v1
          doro.minseok.click/runtime-secret-revision: complete-internal-hmac-directions-v1
  - target:
      kind: Deployment
      name: payment-api
    patch: |-
      # Payment must reload the new Commerce and Store Access direction Secrets.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          doro.minseok.click/runtime-config-revision: payment-handoff-v1
          doro.minseok.click/runtime-secret-revision: complete-internal-hmac-directions-v1
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=doro-erp-admin
    patch: |-
      # Provider Admin uses the same single-AZ scheduling exception as the six
      # Service runtimes while preserving hard hostname spreading.
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints/0
  - target:
      labelSelector: app.kubernetes.io/part-of=doro-erp-admin
    patch: |-
      # Root-level image replacement must cover both Edge deployments, so this
      # overlay composes both namespaces without a global namespace transformer.
      - op: add
        path: /metadata/namespace
        value: doro-provider-admin
  - target:
      kind: ConfigMap
      labelSelector: app.kubernetes.io/part-of=doro-erp
    patch: |-
      - op: add
        path: /data/LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs
      - op: add
        path: /data/LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT
        value: prod-alpha
      - op: add
        path: /data/LOGGING_STRUCTURED_JSON_ADD_CELL
        value: alpha
      - op: add
        path: /data/LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH
        value: "16384"
  - target:
      kind: HTTPRoute
      name: edge-api-route
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: doro-alpha-gateway
  - target:
      kind: TargetGroupConfiguration
      name: edge-api-tgconfig
    patch: |-
      - op: add
        path: /spec/defaultConfiguration/tags/Environment
        value: prod
      - op: add
        path: /spec/defaultConfiguration/tags/Cell
        value: alpha
      - op: add
        path: /spec/defaultConfiguration/tags/Team
        value: team2
  - target:
      kind: ConfigMap
      name: edge-api-runtime
    patch: |-
      - op: add
        path: /data/STORE_ACCESS_INTERNAL_BASE_URL
        value: http://store-access-api.doro-alpha.svc.cluster.local:8081
      - op: add
        path: /data/AUDIT_INTERNAL_BASE_URL
        value: http://audit-api.doro-alpha.svc.cluster.local:8085
      - op: add
        path: /data/PAYMENT_INTERNAL_BASE_URL
        value: http://payment-api.doro-alpha.svc.cluster.local:8083
      - op: add
        path: /data/COMMERCE_INTERNAL_BASE_URL
        value: http://commerce-api.doro-alpha.svc.cluster.local:8082
      - op: add
        path: /data/QUEUE_INTERNAL_BASE_URL
        value: http://queue-api.doro-alpha.svc.cluster.local:8084
      - op: add
        path: /data/EDGE_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/EDGE_TRUSTED_PROXY_CIDR
        value: 10.24.0.0/16
      - op: add
        path: /data/SERVER_FORWARD_HEADERS_STRATEGY
        value: NONE
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_REDIS_HOST
        value: master.doro-erp-prod-alpha-session.q2tpkl.apn2.cache.amazonaws.com
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_REDIS_PORT
        value: "6379"
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_REDIS_SSL_ENABLED
        value: "true"
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_REDIS_CONNECT_TIMEOUT
        value: PT1S
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_REDIS_TIMEOUT
        value: PT1S
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_CLIENT_RATE_LIMIT
        value: "30"
      - op: add
        path: /data/EDGE_PUBLIC_CHECKOUT_CLIENT_RATE_LIMIT_TTL
        value: PT1M
      - op: add
        path: /data/EDGE_ORDER_MUTATION_READ_TIMEOUT
        value: PT10S
  - target:
      kind: ConfigMap
      name: store-access-api-runtime
    patch: |-
      - op: add
        path: /data/STORE_ACCESS_DB_URL
        value: jdbc:postgresql://doro-erp-prod-postgres.cnqmcq6uwqa3.ap-northeast-2.rds.amazonaws.com:5432/store_access_db?sslmode=require
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/STORE_ACCESS_REDIS_HOST
        value: master.doro-erp-prod-alpha-session.q2tpkl.apn2.cache.amazonaws.com
      - op: add
        path: /data/STORE_ACCESS_REDIS_PORT
        value: "6379"
      - op: add
        path: /data/STORE_ACCESS_REDIS_SSL_ENABLED
        value: "true"
      - op: add
        path: /data/COMMERCE_INTERNAL_BASE_URL
        value: http://commerce-api.doro-alpha.svc.cluster.local:8082
      - op: add
        path: /data/PAYMENT_INTERNAL_BASE_URL
        value: http://payment-api.doro-alpha.svc.cluster.local:8083
      - op: add
        path: /data/STORE_ACCESS_COMMERCE_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/STORE_ACCESS_PAYMENT_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/STORE_ACCESS_PAYMENT_CONNECT_TIMEOUT
        value: PT1S
      - op: add
        path: /data/STORE_ACCESS_PAYMENT_READ_TIMEOUT
        value: PT2S
      - op: add
        path: /data/STORE_ACCESS_AUDIT_STANDARD_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-audit-events.fifo
      - op: replace
        path: /data/STORE_ACCESS_AUDIT_OUTBOX_ENABLED
        value: "true"
      - op: replace
        path: /data/STORE_ACCESS_EDGE_PUBLIC_HMAC_ENABLED
        value: "true"
  - target:
      kind: ConfigMap
      name: commerce-api-runtime
    patch: |-
      - op: add
        path: /data/COMMERCE_DB_URL
        value: jdbc:postgresql://doro-erp-prod-postgres.cnqmcq6uwqa3.ap-northeast-2.rds.amazonaws.com:5432/commerce_db?sslmode=require
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/STORE_ACCESS_INTERNAL_BASE_URL
        value: http://store-access-api.doro-alpha.svc.cluster.local:8081
      - op: add
        path: /data/QUEUE_INTERNAL_BASE_URL
        value: http://queue-api.doro-alpha.svc.cluster.local:8084
      - op: add
        path: /data/PAYMENT_INTERNAL_BASE_URL
        value: http://payment-api.doro-alpha.svc.cluster.local:8083
      - op: add
        path: /data/COMMERCE_PAYMENT_HANDOFF_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/COMMERCE_PAYMENT_HANDOFF_CONNECT_TIMEOUT
        value: PT1S
      - op: add
        path: /data/COMMERCE_PAYMENT_HANDOFF_READ_TIMEOUT
        value: PT2S
      - op: add
        path: /data/COMMERCE_STORE_ACCESS_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: replace
        path: /data/COMMERCE_PAYMENT_ELIGIBILITY_PROVIDER_ENABLED
        value: "true"
      - op: replace
        path: /data/COMMERCE_PAYMENT_EVENTS_ENABLED
        value: "true"
      - op: add
        path: /data/COMMERCE_PAYMENT_EVENTS_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-commerce-events.fifo
      - op: replace
        path: /data/COMMERCE_QUEUE_OUTBOX_ENABLED
        value: "true"
      - op: add
        path: /data/COMMERCE_QUEUE_EVENTS_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-queue-events.fifo
      - op: add
        path: /data/COMMERCE_AUDIT_STANDARD_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-audit-events.fifo
      - op: replace
        path: /data/COMMERCE_AUDIT_OUTBOX_ENABLED
        value: "true"
  - target:
      kind: ConfigMap
      name: payment-api-runtime
    patch: |-
      - op: add
        path: /data/PAYMENT_DB_URL
        value: jdbc:postgresql://doro-erp-prod-postgres.cnqmcq6uwqa3.ap-northeast-2.rds.amazonaws.com:5432/payment_db?sslmode=require
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/COMMERCE_INTERNAL_BASE_URL
        value: http://commerce-api.doro-alpha.svc.cluster.local:8082
      - op: add
        path: /data/STORE_ACCESS_INTERNAL_BASE_URL
        value: http://store-access-api.doro-alpha.svc.cluster.local:8081
      - op: add
        path: /data/PAYMENT_COMMERCE_ELIGIBILITY_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: replace
        path: /data/PAYMENT_COMMERCE_ELIGIBILITY_ENABLED
        value: "true"
      - op: add
        path: /data/PAYMENT_DEVICE_VALIDATION_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/PAYMENT_DEVICE_VALIDATION_ENABLED
        value: "true"
      - op: add
        path: /data/PAYMENT_HANDOFF_ENABLED
        value: "true"
      - op: add
        path: /data/PAYMENT_COMMERCE_EVENTS_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-commerce-events.fifo
      - op: add
        path: /data/PAYMENT_AUDIT_EVENTS_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-audit-events.fifo
      - op: replace
        path: /data/PAYMENT_OUTBOX_ENABLED
        value: "true"
  - target:
      kind: ConfigMap
      name: queue-api-runtime
    patch: |-
      - op: add
        path: /data/QUEUE_DB_URL
        value: jdbc:postgresql://doro-erp-prod-postgres.cnqmcq6uwqa3.ap-northeast-2.rds.amazonaws.com:5432/queue_db?sslmode=require
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/STORE_ACCESS_INTERNAL_BASE_URL
        value: http://store-access-api.doro-alpha.svc.cluster.local:8081
      - op: add
        path: /data/QUEUE_STORE_ACCESS_CONTEXT_ENABLED
        value: "true"
      - op: add
        path: /data/QUEUE_STORE_ACCESS_ALLOW_CLUSTER_SERVICE_HTTP
        value: "true"
      - op: add
        path: /data/QUEUE_STORE_ACCESS_CONNECT_TIMEOUT
        value: PT1S
      - op: add
        path: /data/QUEUE_STORE_ACCESS_READ_TIMEOUT
        value: PT2S
      - op: add
        path: /data/QUEUE_ORDER_EVENTS_QUEUE_URL
        value: https://sqs.ap-northeast-2.amazonaws.com/727646470302/doro-erp-prod-alpha-queue-events.fifo
      - op: replace
