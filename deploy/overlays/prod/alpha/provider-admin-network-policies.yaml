apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-provider-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-admin
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-provider-admin-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-admin
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-provider-admin-to-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-admin
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge-api
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-from-provider-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: provider-admin
      ports:
        - port: 8080
          protocol: TCP
