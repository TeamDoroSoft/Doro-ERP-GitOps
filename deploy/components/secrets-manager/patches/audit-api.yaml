apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
spec:
  template:
    spec:
      serviceAccountName: audit-api
      containers:
        - name: audit-api
          envFrom:
            - configMapRef:
                name: audit-api-runtime
            - secretRef:
                name: doro-erp-audit-runtime
          volumeMounts:
            - name: runtime-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: audit-api
