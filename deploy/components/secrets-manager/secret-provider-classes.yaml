apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: edge-api
  namespace: doro-alpha
spec:
  provider: aws
  secretObjects:
    - secretName: doro-erp-edge-runtime
      type: Opaque
      data:
        - objectName: DORO_HMAC_EDGE_TO_STORE_ACCESS_SECRET
          key: DORO_HMAC_EDGE_TO_STORE_ACCESS_SECRET
        - objectName: DORO_HMAC_EDGE_TO_AUDIT_SECRET
          key: DORO_HMAC_EDGE_TO_AUDIT_SECRET
        - objectName: DORO_HMAC_EDGE_TO_PAYMENT_SECRET
          key: DORO_HMAC_EDGE_TO_PAYMENT_SECRET
        - objectName: DORO_HMAC_EDGE_TO_COMMERCE_SECRET
          key: DORO_HMAC_EDGE_TO_COMMERCE_SECRET
  parameters:
    region: ap-northeast-2
    usePodIdentity: "true"
    objects: |
      - objectName: "doro-erp/prod/alpha/hmac/edge-to-store-access"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DORO_HMAC_EDGE_TO_STORE_ACCESS_SECRET"
            objectAlias: "DORO_HMAC_EDGE_TO_STORE_ACCESS_SECRET"
      - objectName: "doro-erp/prod/alpha/hmac/edge-to-audit"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DORO_HMAC_EDGE_TO_AUDIT_SECRET"
            objectAlias: "DORO_HMAC_EDGE_TO_AUDIT_SECRET"
      - objectName: "doro-erp/prod/alpha/hmac/edge-to-payment"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DORO_HMAC_EDGE_TO_PAYMENT_SECRET"
            objectAlias: "DORO_HMAC_EDGE_TO_PAYMENT_SECRET"
      - objectName: "doro-erp/prod/alpha/hmac/edge-to-commerce"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DORO_HMAC_EDGE_TO_COMMERCE_SECRET"
            objectAlias: "DORO_HMAC_EDGE_TO_COMMERCE_SECRET"
---
